name: Publish Tamil site

# Copies tamil-teacher/ to the gh-pages branch, which GitHub Pages serves at
# https://rajesh1231.github.io/My-Projects/ (or the custom domain in tamil-teacher/CNAME, if present).
on:
  push:
    branches: [master]
    paths: ['tamil-teacher/**', '.github/workflows/tamil-site.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tamil-teacher
          enable_jekyll: false
